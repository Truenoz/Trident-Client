<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost" />
  <title>Trident Client</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font: 600 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #ececf1; }
    .menu { box-sizing: border-box; height: 100%; padding: 4px; border-radius: 10px; background: #050506; border: 1px solid #24242a; display: flex; flex-direction: column; }
    button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; cursor: default; }
    button:hover, button:focus-visible { background: #17171c; }
    button.quit:hover, button.quit:focus-visible { background: rgba(229, 57, 70, .16); color: #ff8a93; }
    svg { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
    hr { margin: 4px 6px; border: 0; border-top: 1px solid #1f1f25; }
  </style>
</head>
<body>
  <div class="menu" role="menu">
    <button type="button" role="menuitem" data-action="open">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      Abrir launcher
    </button>
    <hr />
    <button type="button" role="menuitem" class="quit" data-action="quit">
      <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>
      Salir del launcher
    </button>
  </div>
  <script>
    const act = (action) => { window.location.href = 'https://menu.trident.invalid/' + action; };
    document.querySelectorAll('[data-action]').forEach((b) => b.addEventListener('click', () => act(b.dataset.action)));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') act('close'); });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
