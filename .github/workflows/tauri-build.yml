name: Compilar Trident Client (Tauri)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
            bundle: target/release/bundle
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
          - os: ubuntu-22.04
            name: linux
            args: ""
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          key: ${{ matrix.name }}

      - name: Instalar CLI de Tauri
        working-directory: tauri
        run: npm install --no-audit --no-fund

      - name: Poner la versión de la etiqueta
        if: env.RELEASE == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs'), f = 'tauri/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
          " "$v"
          node -e "
            const fs = require('fs'), f = 'tauri/src-tauri/Cargo.toml';
            const t = fs.readFileSync(f, 'utf8').replace(/^version = \".*\"/m, 'version = \"' + process.argv[1] + '\"');
            fs.writeFileSync(f, t);
          " "$v"
          grep -m1 '^version' tauri/src-tauri/Cargo.toml

      - name: Pruebas
        working-directory: tauri/src-tauri
        run: cargo test --release

      - name: Compilar
        working-directory: tauri
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::Faltan los secretos TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          else
            npx tauri build ${{ matrix.args }}
          fi

      - name: Juntar los archivos con nombre fijo
        run: |
          b="tauri/src-tauri/${{ matrix.bundle }}"
          mkdir -p out
          copy() { if [ -f "$1" ]; then cp "$1" "out/$2"; fi; if [ -f "$1.sig" ]; then cp "$1.sig" "out/$2.sig"; fi; }
          case "${{ matrix.name }}" in
            windows)
              copy "$(ls "$b"/nsis/*-setup.exe | head -n 1)" Trident-Client-Setup.exe ;;
            macos)
              copy "$(ls "$b"/dmg/*.dmg | head -n 1)" Trident-Client-macOS.dmg
              copy "$(ls "$b"/macos/*.app.tar.gz | head -n 1)" Trident-Client-macOS.app.tar.gz ;;
            linux)
              copy "$(ls "$b"/appimage/*.AppImage | head -n 1)" Trident-Client-Linux.AppImage
              copy "$(ls "$b"/deb/*.deb | head -n 1)" Trident-Client-Linux.deb ;;
          esac
          ls -la out
          test -n "$(ls out)" || { echo "No se generó nada"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: trident-${{ matrix.name }}
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Archivos del actualizador (latest.json y latest.yml)
        run: |
          ls -la out
          node - "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const [version, tag, repo] = process.argv.slice(2);
          const url = (f) => `https://github.com/${repo}/releases/download/${tag}/${f}`;
          const sig = (f) => fs.existsSync(`out/${f}.sig`) ? fs.readFileSync(`out/${f}.sig`, 'utf8').trim() : null;
          const platforms = {};
          const add = (keys, file) => {
            const s = sig(file);
            if (!s) return;
            for (const k of keys) platforms[k] = { signature: s, url: url(file) };
          };
          add(['windows-x86_64'], 'Trident-Client-Setup.exe');
          add(['darwin-aarch64', 'darwin-x86_64'], 'Trident-Client-macOS.app.tar.gz');
          add(['linux-x86_64'], 'Trident-Client-Linux.AppImage');
          if (!platforms['windows-x86_64']) { console.error('Falta la firma del instalador de Windows'); process.exit(1); }
          const now = new Date().toISOString();
          fs.writeFileSync('out/latest.json', JSON.stringify({ version, notes: `Trident Client ${version}`, pub_date: now, platforms }, null, 2) + '\n');
          const exe = fs.readFileSync('out/Trident-Client-Setup.exe');
          const sha512 = crypto.createHash('sha512').update(exe).digest('base64');
          fs.writeFileSync('out/latest.yml', [
            `version: ${version}`,
            'files:',
            '  - url: Trident-Client-Setup.exe',
            `    sha512: ${sha512}`,
            `    size: ${exe.length}`,
            'path: Trident-Client-Setup.exe',
            `sha512: ${sha512}`,
            `releaseDate: '${now}'`,
            ''
          ].join('\n'));
          EOF
          cat out/latest.json

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trident Client ${GITHUB_REF_NAME#v}" \
            --notes "Trident Client ${GITHUB_REF_NAME#v}" \
            --latest
